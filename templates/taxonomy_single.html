{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <header class="mb-8 border-b border-slate-800 pb-8">
    <h1 class="text-4xl font-extrabold text-teal-400 mb-2 capitalize">
      {{ taxonomy.name }}: {{ term.name }}
    </h1>
    <!-- A little helper text showing the post count -->
    <p class="text-slate-400">
      {{ term.pages | length }} article(s) filed under this {{ taxonomy.name | trim_end_matches(pat="s") }}
    </p>
  </header>

  <!-- Reuse your existing macro to render the article cards! -->
  {{ macros::blogfeed(posts=term.pages) }}
</div>
{% endblock content %}
