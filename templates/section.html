{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block content %}
    <h1 class="text-4xl font-extrabold text-teal-400 mb-6">
        {{ section.title }}
    </h1>
    
    <!-- Render the "This is the blog page." text -->
    <div class="prose prose-invert lg:prose-xl text-slate-300 mb-12">
        {{ section.content | safe }}
    </div>

    <!-- Render all the articles in this section -->
    {{ macros::blogfeed() }}
{% endblock content %}
