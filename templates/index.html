{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block content %}
<!-- First Half: About Me -->
<h1 class="text-3xl font-bold text-teal-400 mb-6">Home</h1>
<div class="prose prose-invert max-w-none">
  {{ section.content | safe }}
</div>

<!-- Second Half: Latest 3 Articles -->
<h1 class="text-3xl font-bold text-teal-400 mb-6">Recent Posts</h1>
{% set blog = get_section(path="blog/_index.md") %}
{{ macros::blogfeed(posts=blog.pages, limit=3) }}
{% endblock content %}
